# Builds Confidence for macOS (Apple silicon + Intel), Windows and Linux.
# Runs on version tags (v*) or by hand from the Actions tab. The builds are
# attached to the run as artifacts; for a version tag they're also published as
# a GitHub Release (with that version's CHANGELOG notes), which is what the
# app's "Check for Updates" looks at.
name: Build Confidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]     # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: PYTHON="$(which python)" packaging/build_macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Confidence-macOS-${{ runner.arch }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: Confidence-Windows
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04              # oldest glibc we support: runs on 22.04 and newer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (bundled into the app)
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: PYTHON="$(which python)" packaging/build_linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Confidence-Linux-x86_64
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PYTHONPATH=src python3 -c "import sys; from dsan import version as v; print(v.changelog_section(sys.argv[1]) or 'See CHANGELOG.md.')" "$VERSION" > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Confidence ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
